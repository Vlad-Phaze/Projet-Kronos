<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos Research</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kronos.css">
</head>
<body class="desk">
    <div class="container">
        <!-- Header -->
        <header class="desk-bar">
            <div class="brand">
                <div class="brand-mark">KX</div>
                <div>
                    <h1>KRONOS <em>RESEARCH</em></h1>
                    <p class="subtitle">Portfolio research desk</p>
                </div>
            </div>
            <div class="desk-status">
                <span class="status-pill"><span class="live-dot"></span>PAPER</span>
                <span class="status-pill" id="deskClock">--:--:--</span>
            </div>
        </header>
        <main class="home">
            <p class="home-lead">Select a desk</p>
        
        <!-- Navigation Buttons -->
        <div class="strategy-toggle">
            <button type="button" class="strategy-btn active" id="btn-dca" onclick="setStrategy('dca')">Strategie DCA</button>
            <button type="button" class="strategy-btn" id="btn-stop-loss" onclick="setStrategy('stop_loss')">Strategie Stop loss</button>
        </div>

        <div class="launch-grid">
            <a href="configure_smartbot.html?strategy=dca" class="launch-card strategy-link" data-base="configure_smartbot.html">
                <span class="label">Crypto Single</span>
                <span class="description">Configuration individuelle</span>
            </a>
            <a href="run_multi_smartbot.html?strategy=dca" class="launch-card strategy-link" data-base="run_multi_smartbot.html">
                <span class="label">Crypto Multi</span>
                <span class="description">Portfolio multi-actifs</span>
            </a>
            <a href="configure_smartbot_stocks.html?strategy=dca" class="launch-card strategy-link" data-base="configure_smartbot_stocks.html">
                <span class="label">Stock Single</span>
                <span class="description">Actions individuelles</span>
            </a>
            <a href="run_multi_smartbot_stocks.html?strategy=dca" class="launch-card strategy-link" data-base="run_multi_smartbot_stocks.html">
                <span class="label">Stocks Multi</span>
                <span class="description">Portfolio d'actions</span>
            </a>
            <a href="optimize_smartbot.html?strategy=dca" class="launch-card strategy-link" data-base="optimize_smartbot.html">
                <span class="label">Optimizer</span>
                <span class="description">Test de grilles parametres</span>
            </a>
        </div>
        </main>
    </div>
    <footer class="desk-footer">Kronos Research · paper backtests</footer>

    <script>
        let selectedStrategy = 'dca';

        function setStrategy(strategy) {
            selectedStrategy = strategy === 'stop_loss' ? 'stop_loss' : 'dca';

            document.getElementById('btn-dca').classList.toggle('active', selectedStrategy === 'dca');
            document.getElementById('btn-stop-loss').classList.toggle('active', selectedStrategy === 'stop_loss');

            document.querySelectorAll('.strategy-link').forEach((link) => {
                const base = link.getAttribute('data-base');
                link.href = `${base}?strategy=${selectedStrategy}`;
            });
        }

        setStrategy('dca');

        function tickDeskClock() {
            const clock = document.getElementById('deskClock');
            if (!clock) return;
            clock.textContent = new Date().toLocaleTimeString('fr-FR', { hour12: false });
        }
        tickDeskClock();
        setInterval(tickDeskClock, 1000);

    </script>
    <script src="tv_connect.js"></script>
</body>
</html>
