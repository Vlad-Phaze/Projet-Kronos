<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kronos Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kronos.css">
</head>
<body class="desk">
  <header class="desk-bar">
    <div class="brand">
      <div class="brand-mark">KX</div>
      <div>
        <h1>KRONOS <em>RESEARCH</em></h1>
        <p class="subtitle">Legacy multi-asset run</p>
      </div>
    </div>
    <div class="desk-status">
      <span class="status-pill"><span class="live-dot"></span>PAPER</span>
      <span class="status-pill" id="deskClock">--:--:--</span>
    </div>
  </header>
  <nav class="nav-links desk-nav">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="configure_smartbot.html" class="nav-btn">Crypto Single</a>
    <a href="run_multi.html" class="nav-btn active">Legacy Multi</a>
  </nav>
  <div class="legacy">
    <label>Bases (comma)<input id="bases" value="BTC,ETH"></label>
    <label>Weights (comma, optional)<input id="weights" value="0.7,0.3"></label>
    <label>Init cash<input id="init" value="1000000"></label>
    <label>Start<input id="start" value="2025-01-01"></label>
    <label>End<input id="end" value="2025-12-31"></label>
    <label>Exchange<input id="exchange" value="binance"></label>
    <label>Fee<input id="fee" value="0.0004"></label>
    <label>Slippage<input id="slippage" value="0.001"></label>
    <div class="actions" style="padding-left:0">
      <button class="btn btn-primary" id="run" type="button">Run backtest</button>
    </div>
    <h3>Results</h3>
    <pre id="out"></pre>
    <h3>Combined equity</h3>
    <img id="chart" src="" alt="equity chart will appear here">
  </div>
  <script>
    function tickDeskClock() {
      const clock = document.getElementById('deskClock');
      if (!clock) return;
      clock.textContent = new Date().toLocaleTimeString('fr-FR', { hour12: false });
    }
    tickDeskClock();
    setInterval(tickDeskClock, 1000);
    document.getElementById('run').addEventListener('click', async () => {
      const payload = {
        bases: document.getElementById('bases').value,
        weights: document.getElementById('weights').value,
        init_cash: Number(document.getElementById('init').value),
        start: document.getElementById('start').value,
        end: document.getElementById('end').value,
        exchange: document.getElementById('exchange').value,
        fee: Number(document.getElementById('fee').value),
        slippage: Number(document.getElementById('slippage').value)
      };
      document.getElementById('out').textContent = 'Running... this may take a while';
      try{
        const apiBase = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
            ? window.location.origin
            : 'http://127.0.0.1:5002';
        const res = await fetch(`${apiBase}/run-multi-backtest`, {
          method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
        });
        const j = await res.json();
        if(!j.ok){ document.getElementById('out').textContent = JSON.stringify(j); return; }
        document.getElementById('out').textContent = JSON.stringify(j.combined_stats, null, 2);
        const img = document.getElementById('chart');
        img.src = `${apiBase}/plot-combined-equity?ts=${Date.now()}`;
      }catch(e){ document.getElementById('out').textContent = String(e); }
    });
  </script>
  <script src="tv_connect.js"></script>
</body>
</html>
